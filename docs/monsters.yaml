openapi: 3.0.3
info:
  title: Monster Tamers - Monsters service
  version: 0.2.0
  description: |
    The catalogue of every monster in the game: names, images and stats.
    Covers US-10, US-11. Read-only for players.

    The data lives in the service's own Postgres database (monsters-db). At every
    start the service validates seed/monsters.json and seed/images/ and upserts
    them into the database, so editing the seed and restarting is enough.

    Every monster has a PNG image and the stats used in encounters
    (docs/EncounterRules.md): hp, attack, defence and one or two elements.
    speed is stored but not used by the current encounter rules.

    Called by: Ownership (check monsters exist, get the starter set) and
    Encounter (get stats for the team and the wild monster).

servers:
  - url: http://127.0.0.1:4012
    description: Prism mock server, for trying the API before the real service exists
  - url: https://localhost:8443
    description: API Gateway (player endpoints only, /internal is blocked)
  - url: https://monsters:5002
    description: Monsters service inside the docker network

tags:
  - name: monsters
  - name: internal

paths:
  /monsters:
    get:
      tags: [monsters]
      summary: List every monster in the game (US-10)
      description: Shows all monsters, owned or not. Use /collection on Ownership for the player's own.
      security:
        - oauth2: []
      parameters:
        - name: element
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Element'
        - name: rarity
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Rarity'
      responses:
        '200':
          description: All monsters matching the filters (empty list if none match)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonsterSummary'
              example:
                - id: mon-001
                  name: Flameling
                  image_url: /monsters/mon-001/image
                  elements: [fire]
                  rarity: common
                - id: mon-012
                  name: Infernox
                  image_url: /monsters/mon-012/image
                  elements: [fire, dark]
                  rarity: epic
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /monsters/{monster_id}:
    get:
      tags: [monsters]
      summary: Get one monster's image and characteristics (US-11)
      security:
        - oauth2: []
      parameters:
        - $ref: '#/components/parameters/MonsterId'
      responses:
        '200':
          description: The monster with all its stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monster'
              example:
                id: mon-001
                name: Flameling
                image_url: /monsters/mon-001/image
                elements: [fire]
                rarity: common
                starter: true
                stats:
                  hp: 60
                  attack: 70
                  defence: 40
                  speed: 75
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /monsters/{monster_id}/image:
    get:
      tags: [monsters]
      summary: Get the monster's image
      security:
        - oauth2: []
      parameters:
        - $ref: '#/components/parameters/MonsterId'
      responses:
        '200':
          description: The image file
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /internal/monsters:
    get:
      tags: [internal]
      summary: Get several monsters with stats in one call (Encounter, Ownership)
      security:
        - serviceToken: []
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated monster ids, at most 20
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 20
            items:
              type: string
              pattern: '^[a-z0-9-]{1,40}$'
          example: [mon-001, mon-002]
      responses:
        '200':
          description: |
            The requested monsters, in the order asked. An id asked twice is
            returned twice (a team may hold two monsters of the same species).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Monster'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: One or more ids do not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: monster_not_found
                message: Unknown monster ids. ghostcat

  /internal/starters:
    get:
      tags: [internal]
      summary: Get the starter monsters a new player receives (Ownership)
      security:
        - serviceToken: []
      responses:
        '200':
          description: The monsters marked is_starter in the seed (the game rules decide how many a player gets)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonsterSummary'

  /health:
    get:
      tags: [internal]
      summary: Health check (used by docker compose)
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              example:
                status: ok

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: Player token from the Account service (/auth/token)
      flows:
        password:
          tokenUrl: /auth/token
          scopes: {}
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token for service-to-service calls. /internal paths are also unreachable
        from outside because the gateway blocks them. Exact mechanism to be
        decided in docs/security.md (service JWT or mutual TLS).

  parameters:
    MonsterId:
      name: monster_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]{1,40}$'
      example: mon-001

  responses:
    BadRequest:
      description: Invalid path or query parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_request
            message: Invalid value for 'element'.
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
            message: Please log in again.
    NotFound:
      description: No monster with this id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: monster_not_found
            message: This monster does not exist.

  schemas:
    Element:
      type: string
      enum: [fire, water, earth, dark]

    Elements:
      type: array
      minItems: 1
      maxItems: 2
      items:
        $ref: '#/components/schemas/Element'

    Rarity:
      type: string
      enum: [common, rare, epic]

    Stats:
      type: object
      required: [hp, attack, defence, speed]
      properties:
        hp:
          type: integer
          minimum: 1
          maximum: 255
        attack:
          type: integer
          minimum: 1
          maximum: 255
        defence:
          type: integer
          minimum: 1
          maximum: 255
        speed:
          type: integer
          minimum: 1
          maximum: 255

    MonsterSummary:
      type: object
      required: [id, name, image_url, elements, rarity]
      properties:
        id:
          type: string
        name:
          type: string
        image_url:
          type: string
        elements:
          $ref: '#/components/schemas/Elements'
        rarity:
          $ref: '#/components/schemas/Rarity'

    Monster:
      type: object
      required: [id, name, image_url, elements, rarity, starter, stats]
      properties:
        id:
          type: string
        name:
          type: string
        image_url:
          type: string
        elements:
          $ref: '#/components/schemas/Elements'
        rarity:
          $ref: '#/components/schemas/Rarity'
        starter:
          type: boolean
          description: True if new players can receive it
        stats:
          $ref: '#/components/schemas/Stats'

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
