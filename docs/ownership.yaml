openapi: 3.0.3
info:
  title: Monster Tamers - Ownership service
  version: 0.1.0
  description: |
    Each player's monster collection and teams.
    Covers US-06, US-09, US-12, US-14, US-15, US-16 (US-13 is green/optional, not here yet).

    Placeholder game rules (see docs/game-rules.md):
      - a team has 1 to 3 monsters
      - the same owned monster cannot be in a team twice
      - a team cannot hold two monsters of the same species
      - a player can save at most 5 teams
      - a new player gets every starter monster once

    Each owned monster has its own owned_id, so duplicates of a species are separate
    entries in the collection (US-09 criterion 3).

    The player is always taken from the token (sub claim), never from the request body.

    Calls: Bestiary GET /internal/monsters (check monsters exist) and
    GET /internal/starters (starter set).
    Called by: Account (starters) and Encounter (team snapshot, rewards).

servers:
  - url: http://127.0.0.1:4011
    description: Prism mock server, for trying the API before the real service exists
  - url: https://localhost:8443
    description: API Gateway (player endpoints only, /internal is blocked)
  - url: https://ownership:5001
    description: Ownership service inside the docker network

tags:
  - name: collection
  - name: teams
  - name: internal

paths:
  /collection:
    get:
      tags: [collection]
      summary: List the monsters I own (US-09)
      security:
        - oauth2: []
      responses:
        '200':
          description: Only this player's monsters. Empty list if they own none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OwnedMonster'
              example:
                - owned_id: 9b2e4c1a-0f3d-4a7e-8c55-1d2b3c4d5e6f
                  monster_id: flamepup
                  source: starter
                  obtained_at: '2026-11-05T10:00:00Z'
                - owned_id: 4a1f7d2b-6c3e-4b8a-9d10-2e3f4a5b6c7d
                  monster_id: tidefin
                  source: encounter
                  obtained_at: '2026-11-05T10:20:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /teams:
    get:
      tags: [teams]
      summary: List my saved teams
      security:
        - oauth2: []
      responses:
        '200':
          description: This player's teams. Empty list if none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [teams]
      summary: Create a team from monsters I own (US-14)
      security:
        - oauth2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInput'
            example:
              name: Fire squad
              members:
                - 9b2e4c1a-0f3d-4a7e-8c55-1d2b3c4d5e6f
                - 4a1f7d2b-6c3e-4b8a-9d10-2e3f4a5b6c7d
      responses:
        '201':
          description: Team saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
              example:
                team_id: c3d4e5f6-a7b8-4c9d-8e0f-1a2b3c4d5e6f
                name: Fire squad
                members:
                  - owned_id: 9b2e4c1a-0f3d-4a7e-8c55-1d2b3c4d5e6f
                    monster_id: flamepup
                  - owned_id: 4a1f7d2b-6c3e-4b8a-9d10-2e3f4a5b6c7d
                    monster_id: tidefin
                created_at: '2026-11-05T10:30:00Z'
                updated_at: '2026-11-05T10:30:00Z'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Already at the maximum number of saved teams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: too_many_teams
                message: You can save at most 5 teams.
        '422':
          $ref: '#/components/responses/RuleViolation'

  /teams/{team_id}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [teams]
      summary: Get one of my teams
      security:
        - oauth2: []
      responses:
        '200':
          description: The team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TeamNotFound'
    put:
      tags: [teams]
      summary: Replace or remove monsters in my team (US-15)
      description: |
        Sends the whole new team. If any rule is broken, nothing changes and the
        old team stays as it was. Encounters already in progress keep the team as
        it was when they started (Encounter stores its own snapshot).
      security:
        - oauth2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInput'
      responses:
        '200':
          description: Updated team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TeamNotFound'
        '422':
          $ref: '#/components/responses/RuleViolation'
    delete:
      tags: [teams]
      summary: Delete one of my teams
      security:
        - oauth2: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TeamNotFound'

  /teams/validate:
    post:
      tags: [teams]
      summary: Check a team against the game rules without saving it (US-16)
      description: Always 200 if the request is well formed. The answer says valid or lists every broken rule.
      security:
        - oauth2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInput'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
              examples:
                valid:
                  value:
                    valid: true
                    violations: []
                invalid:
                  value:
                    valid: false
                    violations:
                      - rule: team_size
                        message: A team has 1 to 3 monsters, this one has 4.
                      - rule: not_owned
                        message: You do not own monster 11111111-2222-4333-8444-555555555555.
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /internal/players/{player_id}/starters:
    parameters:
      - $ref: '#/components/parameters/PlayerId'
    post:
      tags: [internal]
      summary: Give a new player the starter monsters (called by Account, US-06)
      description: |
        Idempotent. The first call grants the starters and returns 201. Any later
        call grants nothing and returns 200 with the monsters granted the first time.
      security:
        - serviceToken: []
      responses:
        '200':
          description: Starters were already granted before, nothing new added
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OwnedMonster'
        '201':
          description: Starters granted now
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OwnedMonster'
        '400':
          $ref: '#/components/responses/MalformedRequest'

  /internal/players/{player_id}/teams/{team_id}:
    parameters:
      - $ref: '#/components/parameters/PlayerId'
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [internal]
      summary: Get a team and check it is valid and belongs to the player (called by Encounter)
      description: |
        Encounter calls this when a run starts and keeps the answer as the team
        snapshot for that run. Returns 403 if the team belongs to someone else.
      security:
        - serviceToken: []
      responses:
        '200':
          description: The team, with whether it currently satisfies the rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamCheck'
              example:
                team_id: c3d4e5f6-a7b8-4c9d-8e0f-1a2b3c4d5e6f
                player_id: 3f6b1c2e-8a1d-4f0e-9c3b-2d7e5a1f9b44
                members:
                  - owned_id: 9b2e4c1a-0f3d-4a7e-8c55-1d2b3c4d5e6f
                    monster_id: flamepup
                valid: true
                violations: []
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TeamNotFound'

  /internal/players/{player_id}/rewards:
    parameters:
      - $ref: '#/components/parameters/PlayerId'
    post:
      tags: [internal]
      summary: Add a reward monster after a won encounter (called by Encounter, US-12)
      description: |
        Idempotent on run_id, so a reward is never granted twice (US-12 criterion 3).
        The first call adds the monster and returns 201. A repeat with the same
        run_id adds nothing and returns 200 with the monster granted the first time.
        Only Encounter can call this. Players can never trigger it directly.
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewardRequest'
            example:
              run_id: 7e8f9a0b-1c2d-4e3f-8a4b-5c6d7e8f9a0b
              monster_id: tidefin
      responses:
        '200':
          description: Already granted for this run, nothing added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedMonster'
        '201':
          description: Monster added to the collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedMonster'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '404':
          description: The monster does not exist in the Bestiary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /health:
    get:
      tags: [internal]
      summary: Health check (used by docker compose)
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              example:
                status: ok

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: Player token from the Account service (/auth/token)
      flows:
        password:
          tokenUrl: /auth/token
          scopes: {}
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token for service-to-service calls. /internal paths are also unreachable
        from outside because the gateway blocks them. Exact mechanism to be
        decided in docs/security.md (service JWT or mutual TLS).

  parameters:
    TeamId:
      name: team_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlayerId:
      name: player_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    MalformedRequest:
      description: The request body is missing fields or has the wrong format
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_request
            message: members must be a list of owned monster ids.
    RuleViolation:
      description: |
        The team breaks one or more game rules (size, monster not owned, duplicates).
        Nothing is saved.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationResult'
          example:
            valid: false
            violations:
              - rule: not_owned
                message: You do not own monster 11111111-2222-4333-8444-555555555555.
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
            message: Please log in again.
    Forbidden:
      description: The team belongs to another player
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: forbidden
            message: This team is not yours.
    TeamNotFound:
      description: No team with this id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: team_not_found
            message: This team does not exist.

  schemas:
    OwnedMonster:
      type: object
      required: [owned_id, monster_id, source, obtained_at]
      properties:
        owned_id:
          type: string
          format: uuid
          description: This specific copy of the monster
        monster_id:
          type: string
          description: The species, as in the Bestiary
        source:
          type: string
          enum: [starter, encounter]
        obtained_at:
          type: string
          format: date-time

    TeamInput:
      type: object
      required: [name, members]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
        members:
          type: array
          description: owned_id values. Size limits are checked as game rules (422), not here.
          maxItems: 10
          items:
            type: string
            format: uuid

    TeamMember:
      type: object
      required: [owned_id, monster_id]
      properties:
        owned_id:
          type: string
          format: uuid
        monster_id:
          type: string

    Team:
      type: object
      required: [team_id, name, members, created_at, updated_at]
      properties:
        team_id:
          type: string
          format: uuid
        name:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TeamCheck:
      type: object
      required: [team_id, player_id, members, valid, violations]
      properties:
        team_id:
          type: string
          format: uuid
        player_id:
          type: string
          format: uuid
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
        valid:
          type: boolean
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'

    Violation:
      type: object
      required: [rule, message]
      properties:
        rule:
          type: string
          enum: [team_size, not_owned, duplicate_member, duplicate_species]
        message:
          type: string

    ValidationResult:
      type: object
      required: [valid, violations]
      properties:
        valid:
          type: boolean
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'

    RewardRequest:
      type: object
      required: [run_id, monster_id]
      additionalProperties: false
      properties:
        run_id:
          type: string
          format: uuid
          description: The encounter run that earned the reward (idempotency key)
        monster_id:
          type: string
          pattern: '^[a-z0-9-]{1,40}$'

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
