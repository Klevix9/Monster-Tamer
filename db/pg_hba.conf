# Who may connect to a service database, and how. Shared by every *-db container.
#
# - "local" is the Unix socket inside the DB container itself. Only the Postgres
#   entrypoint (first-time setup) and the healthcheck use it, and anyone who can
#   use it already has a shell in the container, so no password is asked.
# - Over the network, only TLS connections ("hostssl") with a password (scram)
#   are accepted. A plain "host" connection matches no line, so it is refused.
#
# TYPE    DATABASE  USER  ADDRESS  METHOD
local     all       all            trust
hostssl   all       all   all      scram-sha-256
